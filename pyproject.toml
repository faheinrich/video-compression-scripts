[project]
name = "video-helper-tools"
version = "1.0.0"
description = "Desktop suite for compressing/archiving, syncing and transcribing videos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.10",
    "numpy",
    "matplotlib",
    "librosa",
    "opencv-python",
    "requests",
    "tqdm",
    "pympi-ling",
    "silero-vad[onnx-cpu]",
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.scripts]
run-whisper-server = "video_helper_tools.transcriber.run_minimal_whisper_server:main"
annotate-to-elan = "video_helper_tools.transcriber.transcribe_video_to_elan:main"

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_helper_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["video_helper_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
