name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install ffmpeg and exiftool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Install ffmpeg and exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - run: uv sync --group dev
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Coverage summary
        if: always()
        shell: bash
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: htmlcov
