name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual test run: builds all apps and keeps them as downloads, but publishes nothing

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
          - os: ubuntu-latest
            label: Linux-x64
          - os: windows-latest
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Build the app
        shell: bash
        run: bash build.sh
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Video Helper Tools.app" "Video-Helper-Tools-${{ matrix.label }}.zip"
          echo "PACKAGE=Video-Helper-Tools-${{ matrix.label }}.zip" >> "$GITHUB_ENV"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "Video-Helper-Tools-${{ matrix.label }}.tar.gz" -C dist "Video Helper Tools"
          echo "PACKAGE=Video-Helper-Tools-${{ matrix.label }}.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Video Helper Tools" -DestinationPath "Video-Helper-Tools-${{ matrix.label }}.zip"
          "PACKAGE=Video-Helper-Tools-${{ matrix.label }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package size
        shell: bash
        run: ls -lh "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.PACKAGE }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Unsigned builds. macOS: right-click the app, choose Open on first start. Windows: SmartScreen shows a warning, choose More info, Run anyway. Requires ffmpeg and exiftool (macOS: brew install ffmpeg exiftool)."
